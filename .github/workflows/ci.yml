name: CI - pruebas y cobertura

on:
  push:
    branches: [main, dev, "test/**", "feature/**"]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: backend (pytest + cobertura)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: software_textil_quality
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_NAME: software_textil_quality
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "55432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Analisis estatico (informativo; deuda previa en inventario/catalogo)
        continue-on-error: true
        run: uv run --locked ruff check .
      - name: Pruebas unitarias, de integracion y cobertura
        run: make reportes
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: build/reports/

  frontend:
    name: frontend (node test + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/inventario/package-lock.json
      - run: npm --prefix frontend/inventario ci
      - run: npm --prefix frontend/inventario test
      - run: npm --prefix frontend/inventario run lint
