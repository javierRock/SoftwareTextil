[project]
name = "software-textil"
version = "0.1.0"
description = "Sistema de gestion textil con Django + DRF + PostgreSQL y arquitectura DDD."
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0",
    "djangorestframework>=3.15",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-django>=4.8",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"

[tool.coverage.run]
branch = true
source = ["apps/ventas/pagos"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.uv]
package = false

# Analisis estatico reproducible: las mismas reglas que SonarLint marca en el
# IDE quedan fijadas aqui para que cualquier integrante obtenga el mismo
# resultado en consola (`uvx ruff check .`).
[tool.ruff]
target-version = "py311"
line-length = 88
# Se excluye lo que no es codigo fuente del proyecto: las migraciones las
# genera Django y `assets/starUML_codigo/` es la exportacion cruda de StarUML,
# conservada solo como evidencia del proceso de modelado (ver
# `docs/modelo_dominio.md`). El codigo ejecutable vive en `apps/`.
extend-exclude = ["*/migrations/*", "assets/starUML_codigo/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: estilo PEP 8
    "F",        # pyflakes: errores reales (nombres e imports)
    "I",        # isort: orden de imports
    "N",        # pep8-naming: convenciones de nombres
    "UP",       # pyupgrade: sintaxis moderna de Python
    "B",        # flake8-bugbear: bugs y code smells frecuentes
    "A",        # flake8-builtins: nombres que tapan builtins
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify: complejidad innecesaria
    "RET",      # flake8-return: retornos redundantes
    "ARG",      # flake8-unused-arguments: parametros muertos
    "DTZ",      # flake8-datetimez: fechas sin zona horaria
    "PT",       # flake8-pytest-style
    "PL",       # pylint: complejidad y valores magicos
    "RUF",      # reglas propias de ruff
    "S",        # flake8-bandit: vulnerabilidades
]

[tool.ruff.lint.per-file-ignores]
# Los tests usan assert (S101) y comparan contra valores literales (PLR2004):
# es justamente lo que se espera de una prueba. El patron cubre tanto la suite
# raiz `tests/` como las suites por modulo (`apps/catalogo/tests/`). Los dobles
# de prueba ademas respetan la firma que reemplazan aunque no usen todos sus
# parametros (ARG001), y la prueba de concurrencia hereda de `TestCase` (PT009).
"**/tests/**" = ["S101", "PLR2004", "PLR0913", "PLR0917", "ARG001", "PT009"]
# El parametro `db` de pytest-django no se usa como valor: su sola presencia
# habilita el acceso a la base de datos en la fixture (de ahi ARG001).
"conftest.py" = ["S101", "PLR2004", "ARG001"]
# DRF impone la firma `(self, request, pk=None)` en las acciones del ViewSet,
# aunque una accion concreta no lea el request.
"**/presentation/views.py" = ["ARG002"]
