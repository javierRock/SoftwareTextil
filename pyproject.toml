[project]
name = "software-textil"
version = "0.1.0"
description = "Sistema de gestion textil con Django + DRF + PostgreSQL y arquitectura DDD."
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0",
    "djangorestframework>=3.15",
    "psycopg2-binary>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"

[tool.uv]
package = false
