sonar.projectKey=softwaretextil-quality-expanded
sonar.projectName=SoftwareTextil Quality Expanded
sonar.sources=apps,config,frontend/inventario,static,templates,scripts,.github,Jenkinsfile,Makefile,manage.py,conftest.py,pyproject.toml,docker-compose.yml,compose.quality.yml
sonar.tests=tests,frontend/inventario
sonar.test.inclusions=tests/**,frontend/inventario/**/*.test.js
sonar.exclusions=**/migrations/**,**/tests/**,**/__pycache__/**,**/node_modules/**,**/dist/**,**/*.test.js,**/package-lock.json
sonar.python.version=3.11
sonar.python.coverage.reportPaths=build/reports/sonar-coverage.xml
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true
