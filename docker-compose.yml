services:
  db:
    image: postgres:16-alpine
    container_name: software_textil_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-software_textil}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-software_textil}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos_postgres:
